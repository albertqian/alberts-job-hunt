# ---------------------------------------------------------------
# Target-company watchlist.
#
# For each company the agent first tries the free public job-board APIs
# (Greenhouse, Lever, Ashby) using a guessed board name. If none answers,
# the company is checked through web search instead (slower, costs a search).
#
# Optional fields:
#   ats:  greenhouse | lever | ashby     (skip guessing)
#   slug: the board name in the careers URL, e.g. boards.greenhouse.io/<slug>
#   domain: company website, used to focus web search
#
# Add, remove or reorder freely. Starter list seeded from your three industries.
# ---------------------------------------------------------------

